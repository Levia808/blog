services:
  - type: web
    name: blog-music-api
    env: node
    rootDir: music-api
    buildCommand: npm ci && npm run check
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGIN
        value: https://levia808.github.io,https://blog-go3.pages.dev
      - key: PLAYER_ADMIN_TOKEN
        sync: false
      - key: XEAPI_PUBLIC_KEY_JSON
        sync: false

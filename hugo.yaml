baseURL: https://blog-go3.pages.dev/
locale: zh-cn
title: 我的博客
theme: PaperMod

enableRobotsTXT: true
hasCJKLanguage: true

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  author: Levia808
  description: 个人技术博客 — 记录学习、思考与技术分享。
  defaultTheme: light
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  comments: true

  keywords: [博客, 技术, 编程, 学习]

  homeInfoParams:
    Title: 欢迎来到我的博客
    Content: 这里记录我的学习与思考。

  socialIcons:
    - name: github
      url: https://github.com/Levia808

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys:
      - title
      - content
      - summary
      - tags


menu:
  main:
    - name: 归档
      url: archives/
      weight: 10
    - name: 搜索
      url: search/
      weight: 15
    - name: 标签
      url: tags/
      weight: 20
    - name: 关于
      url: about/
      weight: 30
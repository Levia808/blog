<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>文章编辑器 - Levia's blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="../fonts/Playfair_Display.css" rel="stylesheet">
  <link href="../fonts/Space_Grotesk.css" rel="stylesheet">
  <link href="../fonts/JetBrains_Mono.css" rel="stylesheet">
  <style>
    html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
    .cms-gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #18211d; background: #eef1ed; }
    .cms-gate[hidden] { display: none; }
    .cms-gate-card { max-width: 460px; padding: 28px; border: 1px solid #cbd5ce; background: #fff; }
    .cms-gate-card a { color: inherit; }
    .cms-gate-card ol { padding-left: 20px; font-size: 13px; line-height: 1.8; color: #33413a; }
    .cms-gate-card code { background: #eef1ed; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="cms-gate" id="cmsGate">
    <div class="cms-gate-card">
      <h1>文章编辑器</h1>
      <p id="cmsGateMessage">正在验证管理员权限…</p>
      <a id="cmsGateBack" href="../admin/" hidden>返回管理后台</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script>
    (async function () {
      var message = document.getElementById('cmsGateMessage');
      var back = document.getElementById('cmsGateBack');
      try {
        var allowed = await window.Admin.isAdmin();
        if (!allowed) {
          message.innerHTML = '此编辑器仅对管理员开放。请确认：<ol><li>已用 GitHub 账号登录本站（右上角头像）</li><li>该账号为 SUPERADMIN（个人主页可查看角色徽章）</li></ol>';
          back.hidden = false;
          return;
        }
        document.getElementById('cmsGate').hidden = true;
        var cms = document.createElement('script');
        cms.src = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';
        cms.onload = function () { registerEditorComponents(); registerFontPreviewWidget(); };
        document.head.appendChild(cms);
      } catch (error) {
        message.textContent = '管理员权限验证失败，请返回后台重试。';
        back.hidden = false;
      }
    })();

    // 标题字体选择 + 实时预览窗格 (自定义 widget, 用 Sveltia 内部 React)
    var FONT_OPTIONS = [
      { value: 'display', label: 'Playfair Display（杂志衬线·默认）', font: "'Playfair Display', Georgia, serif" },
      { value: 'grotesk', label: 'Space Grotesk（几何无衬线）', font: "'Space Grotesk', sans-serif" },
      { value: 'mono', label: 'JetBrains Mono（等宽）', font: "'JetBrains Mono', monospace" },
      { value: 'serif', label: 'Georgia 衬线', font: "Georgia, 'Times New Roman', serif" },
      { value: 'sans', label: '系统无衬线（苹方/雅黑）', font: "system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" },
      { value: 'song', label: '宋体（Songti/SimSun）', font: "'Songti SC', 'Noto Serif SC', 'SimSun', serif" },
      { value: 'kai', label: '楷体（Kaiti/KaiTi）', font: "'Kaiti SC', 'KaiTi', 'STKaiti', serif" },
      { value: 'black', label: '特粗黑体（900）', font: "'Space Grotesk', sans-serif", weight: 900 },
      { value: 'custom', label: '自定义字体（上传文件）', font: "Georgia, serif" }
    ];
    function registerFontPreviewWidget() {
      var CMS = window.CMS;
      if (!CMS || typeof CMS.registerWidget !== 'function' || !window.createElement) {
        setTimeout(registerFontPreviewWidget, 200);
        return;
      }
      var R = window.createElement;
      function readField(keyPath) {
        var el = document.querySelector('[data-key-path="' + keyPath + '"] input, [data-key-path="' + keyPath + '"] textarea, [data-key-path*="' + keyPath + '"] input');
        return el ? (el.value || '').trim() : '';
      }
      function readFileField(keyPath) {
        var v = readField(keyPath);
        if (v && /\.(ttf|otf|woff2?|eot)$/i.test(v)) return v;
        var container = document.querySelector('[data-key-path="' + keyPath + '"]');
        if (!container) return '';
        /* 取最后一个文件名匹配 (避免匹配到按钮文字/旧名残留), 支持中文/空格 */
        var matches = container.textContent.match(/[^\s\"'()]+?\.(?:ttf|otf|woff2?|eot)/gi);
        if (matches && matches.length) {
          var last = matches[matches.length - 1].trim();
          if (last) return '/images/' + last;
        }
        return '';
      }
      function ensureFontFace(filePath, name, force) {
        var id = 'fpLiveFace';
        var st0 = document.getElementById(id);
        if (!force && st0 && st0.textContent.indexOf(filePath) >= 0) return;
        if (st0) st0.remove();
        var format = 'truetype';
        if (/\.woff2$/i.test(filePath)) format = 'woff2';
        else if (/\.woff$/i.test(filePath)) format = 'woff';
        else if (/\.otf$/i.test(filePath)) format = 'opentype';
        var bust = '?v=' + Date.now();
        var st = document.createElement('style');
        st.id = id;
        st.textContent = "@font-face { font-family: '" + name + "'; src: url('" + filePath + bust + "') format('" + format + "'); font-display: swap; }";
        document.head.appendChild(st);
      }
      var FontSelectControl = function (props) {
        var R = window.createElement;
        var value = props.value || 'display';

        /* 动态字体选项: 内置 9 项 + 当前文章已上传字体文件 (值=路径) */
        function readSavedFontFile() {
          var container = document.querySelector('[data-key-path="entry_title_font_file"]');
          if (!container) return '';
          var v = container.querySelector('input');
          if (v && v.value && /\.(ttf|otf|woff2?|eot)$/i.test(v.value)) return v.value.trim();
          var matches = container.textContent.match(/[^\s\"'()]+?\.(?:ttf|otf|woff2?|eot)/gi);
          if (matches && matches.length) return '/images/' + matches[matches.length - 1].trim();
          return '';
        }
        function buildOptions() {
          var list = [];
          for (var i = 0; i < FONT_OPTIONS.length; i++) list.push(FONT_OPTIONS[i].value);
          var saved = readSavedFontFile();
          if (saved) list.push(saved);
          if (value && list.indexOf(value) < 0) list.push(value);
          return list;
        }
        function labelOf(v) {
          if (/\.(ttf|otf|woff2?|eot)$/i.test(v)) {
            var name = v.split('/').pop() || v;
            return '自定义字体: ' + name;
          }
          for (var i = 0; i < FONT_OPTIONS.length; i++) {
            if (FONT_OPTIONS[i].value === v) return FONT_OPTIONS[i].label;
          }
          return v;
        }
        function fontOf(v) {
          if (/\.(ttf|otf|woff2?|eot)$/i.test(v)) return 'path';
          for (var i = 0; i < FONT_OPTIONS.length; i++) {
            if (FONT_OPTIONS[i].value === v) return FONT_OPTIONS[i];
          }
          return null;
        }

        var timer = null;
        var opts = [];
        var optValues = buildOptions();
        for (var oi = 0; oi < optValues.length; oi++) {
          opts.push(R('option', { key: optValues[oi], value: optValues[oi] }, labelOf(optValues[oi])));
        }

        var container = R('div', { ref: function (node) {
          if (node) {
            var previewEl = node.querySelector('.fp-live-preview');
            var update = function () {
              if (!previewEl) return;
              var titleEl = document.querySelector('[data-key-path="title"] input');
              var title = titleEl ? (titleEl.value || '').trim() : '';
              previewEl.textContent = title || '（未设置标题）';
              var sel = node.querySelector('select');
              var v = sel ? sel.value : 'display';
              var f = fontOf(v);
              if (f === 'path') {
                ensureFontFace(v, 'fpLiveCustom', true);
                previewEl.style.fontFamily = "'fpLiveCustom', serif";
                previewEl.style.fontWeight = 'normal';
              } else if (f) {
                previewEl.style.fontFamily = f.font;
                previewEl.style.fontWeight = f.weight ? '900' : 'normal';
              } else {
                previewEl.style.fontFamily = 'Georgia, serif';
                previewEl.style.fontWeight = 'normal';
              }
            };
            update();
            var titleInput = null;
            var watch = setInterval(function () {
              var t = document.querySelector('[data-key-path="title"] input');
              if (t !== titleInput) {
                if (titleInput) titleInput.removeEventListener('input', update);
                titleInput = t;
                if (titleInput) titleInput.addEventListener('input', update);
              }
              update();
            }, 150);
            var selEl = node.querySelector('select');
            if (selEl) selEl.addEventListener('change', update);
            /* 已保存字体文件变化 → 进度条 + 上传完成校验 → 刷新选项与预览 */
            var fc = document.querySelector('[data-key-path="entry_title_font_file"]');
            var optTimer = null;
            var progIv = null;
            var progress = node.querySelector('.fp-progress');
            var progressFill = node.querySelector('.fp-progress-fill');
            if (fc && window.MutationObserver) {
              new MutationObserver(function () {
                if (!progIv) {
                  if (progress) progress.style.display = 'block';
                  var p = 8;
                  progIv = setInterval(function () {
                    p = Math.min(90, p + 14);
                    if (progressFill) progressFill.style.width = p + '%';
                  }, 180);
                }
                clearTimeout(optTimer);
                optTimer = setTimeout(function () {
                  var saved = readSavedFontFile();
                  if (saved) {
                    clearInterval(progIv);
                    progIv = null;
                    if (progressFill) progressFill.style.width = '100%';
                    setTimeout(function () {
                      if (progress) progress.style.display = 'none';
                      if (progressFill) progressFill.style.width = '0%';
                    }, 300);
                    rebuildOptions();
                    update();
                  } else {
                    optTimer = setTimeout(arguments.callee, 900);
                  }
                }, 900);
              }).observe(fc, { childList: true, subtree: true, characterData: true });
            }
            /* 刷新按钮: 强制重建字体 + 重建选项 + 刷新预览 */
            var refreshBtn = node.querySelector('.fp-refresh');
            if (refreshBtn) refreshBtn.addEventListener('click', function () {
              var saved = readSavedFontFile();
              if (saved) ensureFontFace(saved, 'fpLiveCustom', true);
              rebuildOptions();
              update();
            });
            function rebuildOptions() {
              if (!selEl) return;
              var cur = selEl.value;
              var list = buildOptions();
              var keep = '';
              for (var i = 0; i < list.length; i++) if (list[i] === cur) keep = cur;
              selEl.innerHTML = '';
              for (var i = 0; i < list.length; i++) {
                var o = document.createElement('option');
                o.value = list[i];
                o.textContent = labelOf(list[i]);
                selEl.appendChild(o);
              }
              selEl.value = keep || value;
              update();
            }
          } else if (timer) {
            clearInterval(timer);
            timer = null;
          }
        } },
          R('select', {
            value: value,
            onChange: function (e) { props.onChange(e.target.value); },
            style: { width: '100%', padding: '9px 12px', borderRadius: '8px', border: '1px solid #cbd5ce', fontSize: '14px', background: '#fff', color: '#18211d', boxSizing: 'border-box' }
          }, opts),
          R('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginTop: '12px' } },
            R('div', { className: 'fp-live-preview', style: { flex: 1, padding: '18px 16px', border: '1px dashed #cbd5ce', borderRadius: '10px', background: '#f6f8f6', fontSize: '26px', color: '#111', letterSpacing: '-0.01em', lineHeight: 1.3, minHeight: '52px' } }, '加载中…'),
            R('button', { className: 'fp-refresh', type: 'button', title: '刷新字体预览', style: { flex: 'none', padding: '8px 12px', borderRadius: '8px', border: '1px solid #cbd5ce', background: '#fff', color: '#333', fontSize: '13px', cursor: 'pointer' } }, '⟳ 刷新')
          ),
          R('div', { className: 'fp-progress', style: { display: 'none', marginTop: '8px', height: '4px', borderRadius: '99px', background: '#e5e9e6', overflow: 'hidden' } },
            R('div', { className: 'fp-progress-fill', style: { height: '100%', width: '0%', background: '#6b8b6b', borderRadius: '99px', transition: 'width .15s ease-out' } })
          ),
          R('div', { style: { marginTop: '8px', fontSize: '12px', color: '#7a8a80' } }, '上传字体后下拉自动出现「自定义字体: 文件名」选项；也可在上方「自定义标题字体文件」字段上传')
        );
        return container;
      };
      var FontSelectPreview = function (props) {
        return R('span', null, props.value || 'display');
      };
      try {
        CMS.registerWidget('fontPreviewSelect', FontSelectControl, FontSelectPreview);
      } catch (error) {
        console.error('字体预览 widget 注册失败:', error);
      }
    }

    // 编辑器内嵌组件: 视频 / 音频 (Hugo shortcode, 支持编辑器内直接上传文件)
    function registerEditorComponents() {
      var CMS = window.CMS;
      if (!CMS || typeof CMS.registerEditorComponent !== 'function') return;

      CMS.registerEditorComponent({
        id: 'video',
        label: '视频',
        icon: 'play_circle',
        fields: [
          { name: 'src', label: '视频文件', widget: 'file', required: true },
          { name: 'poster', label: '封面图', widget: 'image', required: false },
          { name: 'caption', label: '说明', required: false }
        ],
        pattern: /{{< video src="(?<src>.*?)"(?: poster="(?<poster>.*?)")?(?: caption="(?<caption>.*?)")? >}}/,
        fromBlock: function (match) {
          return { src: match.groups.src || '', poster: match.groups.poster || '', caption: match.groups.caption || '' };
        },
        toBlock: function (data) {
          var out = '{{< video src="' + (data.src || '') + '"';
          if (data.poster) out += ' poster="' + data.poster + '"';
          if (data.caption) out += ' caption="' + data.caption + '"';
          return out + ' >}}';
        },
        toPreview: function (data) {
          return '<figure><video src="' + (data.src || '') + '" controls' +
            (data.poster ? ' poster="' + data.poster + '"' : '') +
            ' style="width:100%"></video>' +
            (data.caption ? '<figcaption>' + data.caption + '</figcaption>' : '') + '</figure>';
        }
      });

      CMS.registerEditorComponent({
        id: 'audio',
        label: '音频',
        icon: 'music_note',
        fields: [
          { name: 'src', label: '音频文件', widget: 'file', required: true },
          { name: 'caption', label: '说明', required: false }
        ],
        pattern: /{{< audio src="(?<src>.*?)"(?: caption="(?<caption>.*?)")? >}}/,
        fromBlock: function (match) {
          return { src: match.groups.src || '', caption: match.groups.caption || '' };
        },
        toBlock: function (data) {
          var out = '{{< audio src="' + (data.src || '') + '"';
          if (data.caption) out += ' caption="' + data.caption + '"';
          return out + ' >}}';
        },
        toPreview: function (data) {
          return '<figure><audio src="' + (data.src || '') + '" controls style="width:100%"></audio>' +
            (data.caption ? '<figcaption>' + data.caption + '</figcaption>' : '') + '</figure>';
        }
      });
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>文章编辑器 - Levia's blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="../fonts/Playfair_Display.css" rel="stylesheet">
  <link href="../fonts/Space_Grotesk.css" rel="stylesheet">
  <link href="../fonts/JetBrains_Mono.css" rel="stylesheet">
  <style>
    html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
    .cms-gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #18211d; background: #eef1ed; }
    .cms-gate[hidden] { display: none; }
    .cms-gate-card { max-width: 460px; padding: 28px; border: 1px solid #cbd5ce; background: #fff; }
    .cms-gate-card a { color: inherit; }
    .cms-gate-card ol { padding-left: 20px; font-size: 13px; line-height: 1.8; color: #33413a; }
    .cms-gate-card code { background: #eef1ed; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="cms-gate" id="cmsGate">
    <div class="cms-gate-card">
      <h1>文章编辑器</h1>
      <p id="cmsGateMessage">正在验证管理员权限…</p>
      <a id="cmsGateBack" href="../admin/" hidden>返回管理后台</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script>
    (async function () {
      var message = document.getElementById('cmsGateMessage');
      var back = document.getElementById('cmsGateBack');
      try {
        var allowed = await window.Admin.isAdmin();
        if (!allowed) {
          message.innerHTML = '此编辑器仅对管理员开放。请确认：<ol><li>已用 GitHub 账号登录本站（右上角头像）</li><li>该账号为 SUPERADMIN（个人主页可查看角色徽章）</li></ol>';
          back.hidden = false;
          return;
        }
        document.getElementById('cmsGate').hidden = true;
        var cms = document.createElement('script');
        cms.src = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';
        cms.onload = function () { registerEditorComponents(); registerFontPreviewWidget(); };
        document.head.appendChild(cms);
      } catch (error) {
        message.textContent = '管理员权限验证失败，请返回后台重试。';
        back.hidden = false;
      }
    })();

    // 标题字体选择 + 实时预览窗格 (自定义 widget, 用 Sveltia 内部 React)
    var FONT_OPTIONS = [
      { value: 'display', label: 'Playfair Display（杂志衬线·默认）', font: "'Playfair Display', Georgia, serif" },
      { value: 'grotesk', label: 'Space Grotesk（几何无衬线）', font: "'Space Grotesk', sans-serif" },
      { value: 'mono', label: 'JetBrains Mono（等宽）', font: "'JetBrains Mono', monospace" },
      { value: 'serif', label: 'Georgia 衬线', font: "Georgia, 'Times New Roman', serif" },
      { value: 'sans', label: '系统无衬线（苹方/雅黑）', font: "system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" },
      { value: 'song', label: '宋体（Songti/SimSun）', font: "'Songti SC', 'Noto Serif SC', 'SimSun', serif" },
      { value: 'kai', label: '楷体（Kaiti/KaiTi）', font: "'Kaiti SC', 'KaiTi', 'STKaiti', serif" },
      { value: 'black', label: '特粗黑体（900）', font: "'Space Grotesk', sans-serif", weight: 900 },
      { value: 'custom', label: '自定义字体（上传文件）', font: "Georgia, serif" }
    ];
    function registerFontPreviewWidget() {
      var CMS = window.CMS;
      if (!CMS || typeof CMS.registerWidget !== 'function' || !window.createElement) {
        setTimeout(registerFontPreviewWidget, 200);
        return;
      }
      var R = window.createElement;
      function readField(keyPath) {
        var el = document.querySelector('[data-key-path="' + keyPath + '"] input, [data-key-path="' + keyPath + '"] textarea, [data-key-path*="' + keyPath + '"] input');
        return el ? (el.value || '').trim() : '';
      }
      function readFileField(keyPath) {
        var v = readField(keyPath);
        if (v && /\.(ttf|otf|woff2?|eot)$/i.test(v)) return v;
        var container = document.querySelector('[data-key-path="' + keyPath + '"]');
        if (!container) return '';
        /* 取最后一个文件名匹配 (避免匹配到按钮文字/旧名残留), 支持中文/空格 */
        var matches = container.textContent.match(/[^\s\"'()]+?\.(?:ttf|otf|woff2?|eot)/gi);
        if (matches && matches.length) {
          var last = matches[matches.length - 1].trim();
          if (last) return '/images/' + last;
        }
        return '';
      }
      function ensureFontFace(filePath, name, force) {
        var id = 'fpLiveFace';
        var st0 = document.getElementById(id);
        if (!force && st0 && st0.textContent.indexOf(filePath) >= 0) return;
        if (st0) st0.remove();
        var format = 'truetype';
        if (/\.woff2$/i.test(filePath)) format = 'woff2';
        else if (/\.woff$/i.test(filePath)) format = 'woff';
        else if (/\.otf$/i.test(filePath)) format = 'opentype';
        var bust = '?v=' + Date.now();
        var st = document.createElement('style');
        st.id = id;
        st.textContent = "@font-face { font-family: '" + name + "'; src: url('" + filePath + bust + "') format('" + format + "'); font-display: swap; }";
        document.head.appendChild(st);
      }
      /* 上传字体到 GitHub (复用后台 GitHub 授权) */
      function uploadFontToGitHub(file, onProgress) {
        var token = null;
        try { token = window.localStorage.getItem('blog_gh_publish_token') || null; } catch (e) {}
        if (!token) return Promise.reject(new Error('未找到 GitHub 授权，请先在管理后台完成 GitHub 授权'));
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            var b64 = String(reader.result).split(',')[1];
            var xhr = new XMLHttpRequest();
            xhr.open('PUT', 'https://api.github.com/repos/Levia808/blog/contents/assets/images/' + encodeURIComponent(file.name));
            xhr.setRequestHeader('Authorization', 'Bearer ' + token);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.upload.onprogress = function (e) {
              if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
            };
            xhr.onload = function () {
              if (xhr.status === 200 || xhr.status === 201) {
                /* 同步更新字体清单 (fonts.json 权威列表, 有新字体才更新) */
                updateFontList('/images/' + file.name, token);
                resolve('/images/' + file.name);
              } else {
                var msg = '上传失败 ' + xhr.status;
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
                reject(new Error(msg));
              }
            };
            xhr.onerror = function () { reject(new Error('网络错误，上传失败')); };
            xhr.send(JSON.stringify({ message: '上传字体: ' + file.name, content: b64 }));
          };
          reader.onerror = function () { reject(new Error('读取文件失败')); };
          reader.readAsDataURL(file);
        });
      }
      /* 更新 fonts.json: 追加新字体路径 (UTF-8 安全 base64) */
      function updateFontList(entry, token) {
        fetch('/fonts.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : []; })
          .catch(function () { return []; })
          .then(function (list) {
            if (!Array.isArray(list)) list = [];
            if (list.indexOf(entry) < 0) list.push(entry);
            return fetch('https://api.github.com/repos/Levia808/blog/contents/static/fonts.json', {
              headers: { 'Authorization': 'Bearer ' + token }
            }).then(function (r) { return r.ok ? r.json() : null; }).then(function (meta) {
              var body = { message: '字体库更新: ' + entry.split('/').pop(), content: btoa(unescape(encodeURIComponent(JSON.stringify(list)))) };
              if (meta && meta.sha) body.sha = meta.sha;
              return fetch('https://api.github.com/repos/Levia808/blog/contents/static/fonts.json', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
              });
            });
          })
          .catch(function () { /* 清单更新失败不阻塞上传流程 */ });
      }
      var latestUploadRaw = null;
      /* 全局辅助函数 (控件渲染 + 全局逻辑共用) */
      function readSavedFontFile() {
        var container = document.querySelector('[data-key-path="entry_title_font_file"]');
        if (!container) return '';
        var v = container.querySelector('input');
        if (v && v.value && /\.(ttf|otf|woff2?|eot)$/i.test(v.value)) return v.value.trim();
        var matches = container.textContent.match(/[^\s\"'()]+?\.(?:ttf|otf|woff2?|eot)/gi);
        if (matches && matches.length) return '/images/' + matches[matches.length - 1].trim();
        return '';
      }
      function buildOptions(value) {
        var list = [];
        for (var i = 0; i < FONT_OPTIONS.length; i++) list.push(FONT_OPTIONS[i].value);
        var saved = readSavedFontFile();
        if (saved && list.indexOf(saved) < 0) list.push(saved);
        if (value && list.indexOf(value) < 0) list.push(value);
        return list;
      }
      function labelOf(v) {
        if (/\.(ttf|otf|woff2?|eot)$/i.test(v)) return '自定义字体: ' + v.split('/').pop();
        for (var i = 0; i < FONT_OPTIONS.length; i++) {
          if (FONT_OPTIONS[i].value === v) return FONT_OPTIONS[i].label;
        }
        return v;
      }
      function ensureOption(sel, v) {
        if (!sel) return;
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === v) return;
        }
        var o = document.createElement('option');
        o.value = v;
        o.textContent = '自定义字体: ' + String(v).split('/').pop();
        sel.appendChild(o);
      }
      function fontOf(v) {
        if (/\.(ttf|otf|woff2?|eot)$/i.test(v)) return 'path';
        for (var i = 0; i < FONT_OPTIONS.length; i++) {
          if (FONT_OPTIONS[i].value === v) return FONT_OPTIONS[i];
        }
        return null;
      }
      var FontSelectControl = function (props) {
        var R = window.createElement;
        var value = props.value || 'display';
        var opts = [];
        var optValues = buildOptions(value);
        for (var oi = 0; oi < optValues.length; oi++) {
          opts.push(R('option', { key: optValues[oi], value: optValues[oi] }, labelOf(optValues[oi])));
        }
        return R('div', { className: 'fp-root', 'data-fp-value': value, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
          R('div', { style: { fontSize: '12px', fontWeight: 600, color: '#4a5b51', letterSpacing: '0.5px' } }, '选择字体'),
          R('select', {
            value: value,
            onChange: function (e) { props.onChange(e.target.value); },
            style: { width: '100%', padding: '9px 12px', borderRadius: '8px', border: '1px solid #cbd5ce', fontSize: '14px', background: '#fff', color: '#18211d', boxSizing: 'border-box' }
          }, opts),
          R('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            R('label', { style: { flex: 1, padding: '8px 12px', borderRadius: '8px', border: '1px solid #6b8b6b', background: '#eef4ee', color: '#2c4a33', fontSize: '13px', cursor: 'pointer', textAlign: 'center' } },
              '上传自定义字体',
              R('input', { className: 'fp-upload', type: 'file', accept: '.ttf,.otf,.woff,.woff2', style: { display: 'none' } })
            ),
            R('button', { className: 'fp-lib-btn', type: 'button', style: { flex: 1, padding: '8px 12px', borderRadius: '8px', border: '1px solid #cbd5ce', background: '#fff', color: '#2c4a33', fontSize: '13px', cursor: 'pointer' } }, '资源库字体'),
            R('button', { className: 'fp-refresh', type: 'button', style: { flex: 'none', padding: '8px 12px', borderRadius: '8px', border: '1px solid #cbd5ce', background: '#fff', color: '#333', fontSize: '13px', cursor: 'pointer' } }, '⟳ 刷新')
          ),
          R('div', { className: 'fp-lib-panel', style: { display: 'none', border: '1px solid #cbd5ce', borderRadius: '10px', background: '#fafbfa', maxHeight: '220px', overflowY: 'auto' } }),
          R('div', { className: 'fp-lib-note', style: { display: 'none', fontSize: '12px', color: '#7a8a80' } }),
          R('div', { className: 'fp-progress', style: { display: 'none', height: '4px', borderRadius: '99px', background: '#e5e9e6', overflow: 'hidden' } },
            R('div', { className: 'fp-progress-fill', style: { height: '100%', width: '0%', background: '#6b8b6b', borderRadius: '99px', transition: 'width .15s ease-out' } })
          ),
          R('div', { style: { borderTop: '1px dashed #dbe3dd', paddingTop: '10px', fontSize: '12px', fontWeight: 600, color: '#4a5b51', letterSpacing: '0.5px' } }, '预览效果'),
          R('div', { className: 'fp-live-preview', style: { padding: '18px 16px', border: '1px dashed #cbd5ce', borderRadius: '10px', background: '#f6f8f6', fontSize: '26px', color: '#111', letterSpacing: '-0.01em', lineHeight: 1.3, minHeight: '52px' } }, '加载中…')
        );
      };
      var FontSelectPreview = function (props) {
        return R('span', null, props.value || 'display');
      };
      try {
        CMS.registerWidget('fontPreviewSelect', FontSelectControl, FontSelectPreview);
      } catch (error) {
        console.error('字体预览 widget 注册失败:', error);
      }
      initFontPreviewGlobal();
    }

    /* 全局字体预览逻辑: 轮询绑定 + DOM 委托 — Sveltia 重渲染控件
       只重建 UI, 逻辑由本层持续驱动, 组件不会因重渲染失效 */
    function initFontPreviewGlobal() {
      if (window.__fpGlobal) return;
      window.__fpGlobal = true;

      function findRoot() {
        var roots = document.querySelectorAll('.fp-root');
        return roots.length ? roots[roots.length - 1] : null;
      }
      function update(root) {
        if (!root) return;
        var previewEl = root.querySelector('.fp-live-preview');
        var sel = root.querySelector('select');
        if (!previewEl || !sel) return;
        var titleEl = document.querySelector('[data-key-path="title"] input');
        var title = titleEl ? (titleEl.value || '').trim() : '';
        previewEl.textContent = title || '（未设置标题）';
        var v = sel.value;
        var f = fontOf(v);
        if (f === 'path') {
          var raw = latestUploadRaw || null;
          var src = (raw && sel.value === '/images/' + raw.split('/').pop()) ? raw : sel.value;
          ensureFontFace(src, 'fpLiveCustom', true);
          previewEl.style.fontFamily = "'fpLiveCustom', serif";
          previewEl.style.fontWeight = 'normal';
        } else if (f) {
          previewEl.style.fontFamily = f.font;
          previewEl.style.fontWeight = f.weight ? '900' : 'normal';
        } else {
          previewEl.style.fontFamily = 'Georgia, serif';
          previewEl.style.fontWeight = 'normal';
        }
      }
      var libCache = null;
      function loadLib(root) {
        if (!root) return;
        var libPanel = root.querySelector('.fp-lib-panel');
        if (!libPanel) return;
        libPanel.style.display = 'block';
        var render = function (fonts) {
          if (!fonts.length) {
            libPanel.innerHTML = '<div style="padding:14px;font-size:13px;color:#7a8a80">资源库暂无字体文件（.ttf/.otf/.woff/.woff2）</div>';
            return;
          }
          var html = '';
          for (var fi = 0; fi < fonts.length; fi++) {
            var fam = 'fpLib' + fi;
            if (fonts[fi].url) ensureFontFace(fonts[fi].url, fam, true);
            html += '<div class="fp-lib-item" data-url="' + (fonts[fi].url || '') + '" style="padding:10px 14px;border-bottom:1px solid #edf0ed;cursor:pointer;display:flex;align-items:center;gap:12px;justify-content:space-between">' +
              '<span style="font-family:' + (fonts[fi].url ? "'" + fam + "', serif" : 'Georgia, serif') + ';font-size:18px;color:#18211d;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">标题示例｜构建现代化博客</span>' +
              '<small style="flex:none;font-size:11px;color:#7a8a80">' + (fonts[fi].name.replace(/</g, '&lt;')) + '</small></div>';
          }
          libPanel.innerHTML = html;
          Array.prototype.forEach.call(libPanel.querySelectorAll('.fp-lib-item'), function (item) {
            item.addEventListener('mouseover', function () { item.style.background = '#eef4ee'; });
            item.addEventListener('mouseout', function () { item.style.background = 'transparent'; });
            item.addEventListener('click', function () {
              var url = item.getAttribute('data-url');
              if (!url) return;
              var root2 = findRoot();
              var sel2 = root2 ? root2.querySelector('select') : null;
              if (sel2) {
                ensureOption(sel2, url);
                sel2.value = url;
                sel2.dispatchEvent(new Event('change', { bubbles: true }));
              }
              libPanel.style.display = 'none';
              var note = root2 ? root2.querySelector('.fp-lib-note') : null;
              if (note) { note.style.display = 'block'; note.textContent = '已选择资源库字体：' + (item.querySelector('small') ? item.querySelector('small').textContent : url); }
            });
          });
        };
        if (libCache) {
          render(libCache);
          return;
        }
        libPanel.innerHTML = '<div style="padding:14px;font-size:13px;color:#7a8a80">正在读取资源库字体…</div>';
        /* 单一权威列表: fonts.json (构建时生成 + 上传时增量更新), 不再每次扫描 */
        fetch('/fonts.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : []; })
          .catch(function () { return []; })
          .then(function (list) {
            var fonts = [];
            if (Array.isArray(list)) {
              for (var i = 0; i < list.length; i++) {
                if (typeof list[i] === 'string' && /\.(ttf|otf|woff2?|eot)$/i.test(list[i])) {
                  fonts.push({ name: list[i].split('/').pop() || list[i], url: list[i] });
                }
              }
            }
            libCache = fonts;
            render(fonts);
          });
      }

      /* 轮询: 绑定事件 (幂等标记) + 持续更新预览 */
      setInterval(function () {
        var root = findRoot();
        if (!root) return;
        if (!root.dataset.fpBound) {
          root.dataset.fpBound = '1';
          /* 字体清单补充下拉选项 (fonts.json 权威列表) */
          fetch('/fonts.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : []; })
            .catch(function () { return []; })
            .then(function (list) {
              var selx = root.querySelector('select');
              if (!selx || !Array.isArray(list)) return;
              var selv = selx.value;
              for (var i = 0; i < list.length; i++) {
                if (typeof list[i] === 'string' && /\.(ttf|otf|woff2?|eot)$/i.test(list[i])) {
                  ensureOption(selx, list[i]);
                }
              }
              selx.value = selv;
            });
          var sel = root.querySelector('select');
          var uploadInput = root.querySelector('.fp-upload');
          var libBtn = root.querySelector('.fp-lib-btn');
          var refreshBtn = root.querySelector('.fp-refresh');
          var libPanel = root.querySelector('.fp-lib-panel');
          var note = root.querySelector('.fp-lib-note');
          var progress = root.querySelector('.fp-progress');
          var progressFill = root.querySelector('.fp-progress-fill');
          var previewEl = root.querySelector('.fp-live-preview');
          if (sel) sel.addEventListener('change', function () { update(root); });
          if (uploadInput) uploadInput.addEventListener('change', function (e) {
            var f = e.target.files[0];
            if (!f) return;
            if (progress) progress.style.display = 'block';
            if (progressFill) progressFill.style.width = '0%';
            uploadFontToGitHub(f, function (pct) {
              if (progressFill) progressFill.style.width = Math.round(pct * 100) + '%';
            }).then(function (path) {
              if (progressFill) progressFill.style.width = '100%';
              setTimeout(function () { if (progress) progress.style.display = 'none'; }, 300);
              ensureOption(sel, path);
              if (sel) { sel.value = path; sel.dispatchEvent(new Event('change', { bubbles: true })); }
              latestUploadRaw = 'https://raw.githubusercontent.com/Levia808/blog/main/assets/images/' + encodeURIComponent(f.name);
              if (note) { note.style.display = 'block'; note.textContent = '字体已上传并应用：' + f.name + '（保存后封面生效）'; }
            }).catch(function (err) {
              if (progress) progress.style.display = 'none';
              if (note) { note.style.display = 'block'; note.textContent = '上传失败：' + (err && err.message || err); }
            });
          });
          if (libBtn) libBtn.addEventListener('click', function () {
            if (libPanel.style.display === 'block') { libPanel.style.display = 'none'; return; }
            loadLib(root);
          });
          if (refreshBtn) refreshBtn.addEventListener('click', function () { update(root); });
        }
        update(root);
      }, 200);

      /* 标题字段变化 → 更新预览文本 */
      setInterval(function () {
        var root = findRoot();
        if (root) update(root);
      }, 400);
    }

    // 编辑器内嵌组件: 视频 / 音频 (Hugo shortcode, 支持编辑器内直接上传文件)
    function registerEditorComponents() {
      var CMS = window.CMS;
      if (!CMS || typeof CMS.registerEditorComponent !== 'function') return;

      CMS.registerEditorComponent({
        id: 'video',
        label: '视频',
        icon: 'play_circle',
        fields: [
          { name: 'src', label: '视频文件', widget: 'file', required: true },
          { name: 'poster', label: '封面图', widget: 'image', required: false },
          { name: 'caption', label: '说明', required: false }
        ],
        pattern: /{{< video src="(?<src>.*?)"(?: poster="(?<poster>.*?)")?(?: caption="(?<caption>.*?)")? >}}/,
        fromBlock: function (match) {
          return { src: match.groups.src || '', poster: match.groups.poster || '', caption: match.groups.caption || '' };
        },
        toBlock: function (data) {
          var out = '{{< video src="' + (data.src || '') + '"';
          if (data.poster) out += ' poster="' + data.poster + '"';
          if (data.caption) out += ' caption="' + data.caption + '"';
          return out + ' >}}';
        },
        toPreview: function (data) {
          return '<figure><video src="' + (data.src || '') + '" controls' +
            (data.poster ? ' poster="' + data.poster + '"' : '') +
            ' style="width:100%"></video>' +
            (data.caption ? '<figcaption>' + data.caption + '</figcaption>' : '') + '</figure>';
        }
      });

      CMS.registerEditorComponent({
        id: 'audio',
        label: '音频',
        icon: 'music_note',
        fields: [
          { name: 'src', label: '音频文件', widget: 'file', required: true },
          { name: 'caption', label: '说明', required: false }
        ],
        pattern: /{{< audio src="(?<src>.*?)"(?: caption="(?<caption>.*?)")? >}}/,
        fromBlock: function (match) {
          return { src: match.groups.src || '', caption: match.groups.caption || '' };
        },
        toBlock: function (data) {
          var out = '{{< audio src="' + (data.src || '') + '"';
          if (data.caption) out += ' caption="' + data.caption + '"';
          return out + ' >}}';
        },
        toPreview: function (data) {
          return '<figure><audio src="' + (data.src || '') + '" controls style="width:100%"></audio>' +
            (data.caption ? '<figcaption>' + data.caption + '</figcaption>' : '') + '</figure>';
        }
      });
    }
  </script>
</body>
</html>

# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# 媒体使用说明:
# - 图片: 正文中直接拖入媒体库图片即可（markdown ![](/images/...))
# - 视频/音频: 先在媒体库上传 .mp4/.mp3 等文件，然后在正文中写入:
#     {{< video src="/images/xxx.mp4" poster="/images/xxx.jpg" caption="视频标题" >}}
#     {{< audio src="/media/xxx.mp3" caption="音频标题" >}}
#   （markdown 渲染器已开启 unsafe，shortcode 会被 Hugo 渲染为播放器）

backend:
  name: github
  repo: Levia808/blog
  branch: main
  base_url: https://sveltia-cms-auth.18013013170.workers.dev

media_folder: static/images
public_folder: /images

locale: zh-cn
site_url: https://blog-go3.pages.dev/
display_url: https://blog-go3.pages.dev/
logo_url: https://blog-go3.pages.dev/favicon.svg

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: date
        widget: datetime
        required: true
      - label: 草稿
        name: draft
        widget: boolean
        default: true
      - label: 标签
        name: tags
        widget: list
        required: false
      - label: 分类
        name: categories
        widget: list
        required: false
      - label: 摘要
        name: description
        widget: string
        required: false
      - label: 文章底图（页面顶部横幅，与卡片封面无关）
        name: background
        widget: image
        choose_url: true
        required: false
      - label: 卡片封面图（首页/列表卡片）
        name: cover
        widget: object
        required: false
        collapsed: true
        fields:
          - label: 封面图片
            name: image
            widget: image
            choose_url: true
            required: false
      - label: 正文
        name: body
        widget: markdown

  - name: pages
    label: 页面
    label_singular: 页面
    folder: content
    create: true
    filter:
      field: layout
      value: page
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 草稿
        name: draft
        widget: boolean
        default: true
      - label: 布局
        name: layout
        widget: hidden
        default: page
      - label: 正文
        name: body
        widget: markdown

# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# 【发布流程】简单工作流: 保存 = 提交并推送到 main 分支，Cloudflare 自动重建站点。
# 发布 = 在编辑页把「发布状态」开关取消勾选（draft: false）后保存。
# 注意: 草稿状态（draft: true）的文章保存后不会出现在站点上。

# 媒体使用说明:
# - 图片: 正文中直接拖入媒体库图片即可（markdown ![](/images/...))
# - 视频/音频: 先在媒体库上传 .mp4/.mp3 等文件，然后在正文中写入:
#     {{< video src="/images/xxx.mp4" poster="/images/xxx.jpg" caption="视频标题" >}}
#     {{< audio src="/media/xxx.mp3" caption="音频标题" >}}
#   （markdown 渲染器已开启 unsafe，shortcode 会被 Hugo 渲染为播放器）

backend:
  name: github
  repo: Levia808/blog
  branch: main
  base_url: https://sveltia-cms-auth.18013013170.workers.dev

media_folder: assets/images
public_folder: /images
# 图片上传到 assets/images 后由主题 Hugo Pipes 自动压缩: 卡片封面 320px · 文章底图 2K

locale: zh-cn
site_url: https://blog-go3.pages.dev/
display_url: https://blog-go3.pages.dev/
logo_url: https://blog-go3.pages.dev/favicon.svg

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: date
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
      - label: 发布状态
        name: draft
        widget: boolean
        default: true
        hint: "勾选 = 草稿（保存后站点不显示）；取消勾选并保存 = 发布上线"
      - label: 归档
        name: archived
        widget: boolean
        default: false
        required: false
        hint: "勾选 = 归档（从首页/列表隐藏，保留原链接并显示归档标记）"
      - label: 标签
        name: tags
        widget: list
        required: false
      - label: 分类
        name: categories
        widget: list
        required: false
      - label: 摘要
        name: description
        widget: string
        required: false
      - label: 文章底图（页面顶部横幅，与卡片封面无关）
        name: background
        widget: image
        choose_url: true
        required: false
      - label: 全屏标题字体
        name: entry_title_font
        widget: select
        required: false
        default: display
        options:
          - { label: "Playfair Display（默认）", value: display }
          - { label: "Space Grotesk", value: grotesk }
          - { label: "JetBrains Mono", value: mono }
          - { label: "衬线（Georgia）", value: serif }
        hint: "仅「全屏杂志封面入口」卡片样式生效"
      - label: 不在封面显示标题
        name: entry_hide_title
        widget: boolean
        default: false
        required: false
        hint: "勾选后全屏封面只显示引文/标签，隐藏标题"
      - label: 全屏入口标题位置
        name: entry_align
        widget: select
        required: false
        default: left-bottom
        options:
          - { label: 左下, value: left-bottom }
          - { label: 左中, value: left-center }
          - { label: 中下, value: center-bottom }
          - { label: 正中, value: center-center }
          - { label: 右下, value: right-bottom }
        hint: "仅「全屏杂志封面入口」卡片样式生效"
      - label: 全屏入口标题字体
        name: entry_title_font
        widget: select
        required: false
        default: playfair
        options:
          - { label: Playfair Display（杂志衬线）, value: playfair }
          - { label: Space Grotesk（几何无衬线）, value: grotesk }
          - { label: JetBrains Mono（等宽）, value: mono }
          - { label: Inter（无衬线）, value: inter }
      - label: 封面不显示标题（引文替代）
        name: entry_hide_title
        widget: boolean
        default: false
        required: false
        hint: "勾选后全屏入口以引文样式展示标题"
      - label: 卡片封面图（首页/列表卡片）
        name: cover
        widget: object
        required: false
        collapsed: true
        fields:
          - label: 封面图片
            name: image
            widget: image
            choose_url: true
            required: false
      - label: 正文
        name: body
        widget: markdown

  - name: pages
    label: 页面
    label_singular: 页面
    folder: content
    create: true
    filter:
      field: layout
      value: page
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布状态
        name: draft
        widget: boolean
        default: true
        hint: "勾选 = 草稿（保存后站点不显示）；取消勾选并保存 = 发布上线"
      - label: 布局
        name: layout
        widget: hidden
        default: page
      - label: 正文
        name: body
        widget: markdown

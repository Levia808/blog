backend:
  name: github
  repo: Levia808/blog
  branch: main

media_folder: static/images
public_folder: /images

locale: zh-cn
site_url: https://blog-go3.pages.dev/
display_url: https://blog-go3.pages.dev/
logo_url: https://blog-go3.pages.dev/favicon.svg

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: date
        widget: datetime
        required: false
      - label: 草稿
        name: draft
        widget: boolean
        default: true
      - label: 标签
        name: tags
        widget: list
        required: false
      - label: 分类
        name: categories
        widget: list
        required: false
      - label: 摘要
        name: description
        widget: string
        required: false
      - label: 正文
        name: body
        widget: markdown

  - name: pages
    label: 页面
    label_singular: 页面
    folder: content
    create: true
    filter:
      field: layout
      value: page
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 草稿
        name: draft
        widget: boolean
        default: true
      - label: 布局
        name: layout
        widget: hidden
        default: page
      - label: 正文
        name: body
        widget: markdown

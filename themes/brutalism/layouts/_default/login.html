{{- define "body-class" }}login-only{{ end }}
{{ define "main" }}
{{- $P := site.Data.site -}}{{- if not $P }}{{ $P = site.Params }}{{ end -}}
<div class="login-page" id="loginPage">
  <section class="login-form-col">
    <div class="login-form-wrap">
      <a class="login-back mono" href="{{ "" | relLangURL }}" aria-label="返回首页">←</a>
      <div class="login-form-inner">
        <h1 class="login-title animate-element animate-delay-100">登录</h1>

        <!-- 登录表单 -->
        <form class="login-form" id="signInForm" autocomplete="off">
          <div class="animate-element animate-delay-300">
            <label class="login-label" for="loginEmail">邮箱</label>
            <div class="glass-input">
              <input id="loginEmail" name="email" type="email" autocomplete="email" required />
            </div>
          </div>

          <div class="animate-element animate-delay-400">
            <label class="login-label" for="loginPassword">密码</label>
            <div class="glass-input">
              <div class="password-wrap">
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" class="pw-input" required />
                <button type="button" class="pw-toggle" data-toggle-pw aria-label="显示密码" aria-pressed="false">显示</button>
              </div>
            </div>
          </div>

          <div class="animate-element animate-delay-500 login-row">
            <label class="login-remember">
              <input type="checkbox" name="rememberMe" class="custom-checkbox" />
              <span>记住我</span>
            </label>
            <a href="#" class="login-link" data-action="reset">重置密码</a>
          </div>

          <button type="submit" class="login-submit animate-element animate-delay-600">登录</button>
        </form>

        <!-- 注册表单 -->
        <form class="login-form is-hidden" id="signUpForm" autocomplete="off">
          <div class="animate-element animate-delay-300">
            <label class="login-label" for="registerUsername">用户名</label>
            <div class="glass-input">
              <input id="registerUsername" name="username" type="text" autocomplete="username" required />
            </div>
          </div>
          <div class="animate-element animate-delay-400">
            <label class="login-label" for="registerEmail">邮箱</label>
            <div class="glass-input">
              <input id="registerEmail" name="email" type="email" autocomplete="email" required />
            </div>
          </div>
          <div class="animate-element animate-delay-500">
            <label class="login-label" for="registerPassword">密码</label>
            <div class="glass-input">
              <div class="password-wrap">
                <input id="registerPassword" name="password" type="password" autocomplete="new-password" class="pw-input" required minlength="6" />
                <button type="button" class="pw-toggle" data-toggle-pw aria-label="显示密码" aria-pressed="false">显示</button>
              </div>
            </div>
          </div>

          <button type="submit" class="login-submit animate-element animate-delay-600">创建账户</button>
        </form>

        <div class="animate-element animate-delay-700 login-divider">
          <span></span><em>或</em><span></span>
        </div>

        <button class="login-google animate-element animate-delay-800" id="githubSignIn">
          使用 GitHub 继续
        </button>

        <p class="login-switch animate-element animate-delay-900">
          <span data-mode="signin"><a href="#" class="login-link" data-action="signup">创建账户</a></span>
          <span data-mode="signup" class="is-hidden"><a href="#" class="login-link" data-action="signin">登录</a></span>
        </p>
      </div>
    </div>
  </section>

  <section class="login-hero-col" aria-hidden="true">
    <div class="login-hero-bg"></div>
    <div class="login-hero-word" id="loginHeroWord">{{ $P.navLogo | default site.Title }}</div>
  </section>

  <div class="login-toast" id="loginToast" role="status"></div>
</div>
{{ end }}

{{- define "main" }}
<section class="container moments-page">
  <header class="list-header" data-reveal>
    <div class="label">MOMENTS</div>
    <h1 class="list-title">动态</h1>
    <p class="mono list-count">分享生活与技术 · 支持图片 / 视频 / 评论 / 点赞</p>
  </header>

  <div class="moments-wrap" data-reveal>
    <div class="moments-composer" id="momentsComposer" hidden>
      <div class="mc-head">
        <span class="mono mc-label">[ NEW MOMENT ]</span>
        <button type="button" class="btn" id="mcCancelBtn">取消</button>
      </div>
      <textarea id="mcInput" rows="3" maxlength="2000" placeholder="分享此刻…（支持 Markdown）" aria-label="动态内容"></textarea>
      <div class="mc-media-list" id="mcMediaList"></div>
      <div class="mc-actions">
        <div class="mc-loc" id="mcLocBar">
          <button type="button" class="btn mc-loc-add" id="mcLocAdd" style="font-size:12px;">📍 添加地点</button>
          <span class="mc-loc-chip" id="mcLocChip" hidden>
            <span class="mc-loc-dot">📍</span>
            <b id="mcLocName"></b>
            <button type="button" class="mc-loc-remove" id="mcLocRemove" aria-label="移除地点">✕</button>
          </span>
          <div class="mc-loc-panel" id="mcLocPanel" data-lenis-prevent-wheel hidden>
            <div class="mlp-row">
              <button type="button" class="mlp-locate" id="mcLocateBtn">◎ 使用当前位置</button>
              <span class="mlp-status mono" id="mcLocStatus"></span>
            </div>
            <input type="text" class="mlp-search" id="mcLocSearch" placeholder="搜索地点…" autocomplete="off">
            <div class="mlp-list" id="mcLocList"></div>
            <div class="mlp-attr mono">地点数据 © OpenStreetMap</div>
          </div>
        </div>
        <label class="btn" style="cursor:pointer;">+ 添加图片 / 视频<input type="file" id="mcFileInput" accept="image/*,video/*" multiple hidden></label>
        <button type="button" class="btn btn-primary" id="mcPublishBtn">发布</button>
      </div>
      <p class="auth-error" id="mcError" hidden></p>
    </div>

    <div class="moments-login-wall" id="momentsLoginWall" hidden>
      <p>登录后发布动态、点赞与评论。</p>
      <button type="button" class="comments-button comments-button-primary" data-moment-login>登录</button>
    </div>

    <div class="moments-list" id="momentsList" aria-live="polite"></div>
    <div class="hint" id="momentsHint" style="text-align:center;"></div>
  </div>
</section>
{{- end }}

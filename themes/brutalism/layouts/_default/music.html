{{ define "main" }}
<article class="music-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ if .Content }}
    <div class="page-description">{{ .Content }}</div>
    {{ end }}
  </header>

  <div id="musicPlayer" class="music-player-container">
    <div class="player-loading">
      <p>加载播放器...</p>
    </div>
  </div>
</article>

<script>
(function() {
  'use strict';

  const catalog = {{ if .Site.Data.music }}{{ .Site.Data.music.catalog | jsonify }}{{ else }}null{{ end }};

  if (!catalog || !catalog.tracks || catalog.tracks.length === 0) {
    document.getElementById('musicPlayer').innerHTML = `
      <div class="player-empty">
        <p>暂无可用音乐</p>
        <p class="hint">管理员需要先导入和同步歌单</p>
      </div>
    `;
    return;
  }

  const app = {
    catalog,
    currentIndex: 0,
    isPlaying: false,
    audio: null,
    queue: [],
    init() {
      this.audio = new Audio();
      this.audio.preload = 'metadata';
      this.setupAudioEvents();
      this.buildQueue();
      this.renderUI();
      this.setupMediaSession();
    },
    buildQueue() {
      this.queue = this.catalog.tracks
        .map((track, index) => ({ track, index }))
        .filter(item => {
          const match = this.getBestMatch(item.track);
          return match && match.status === 'playable';
        });

      if (this.queue.length === 0) {
        document.getElementById('musicPlayer').innerHTML = `
          <div class="player-empty">
            <p>没有可播放的歌曲</p>
            <p class="hint">所有歌曲都需要人工复核或无可用来源</p>
          </div>
        `;
      }
    },
    getBestMatch(track) {
      if (!track.matches || track.matches.length === 0) return null;
      const index = track.bestMatch >= 0 ? track.bestMatch : 0;
      return track.matches[index];
    },
    setupAudioEvents() {
      this.audio.addEventListener('play', () => {
        this.isPlaying = true;
        this.updatePlayButton();
        this.updateMediaSession();
      });
      this.audio.addEventListener('pause', () => {
        this.isPlaying = false;
        this.updatePlayButton();
      });
      this.audio.addEventListener('ended', () => {
        this.next();
      });
      this.audio.addEventListener('timeupdate', () => {
        this.updateProgress();
      });
      this.audio.addEventListener('error', (e) => {
        console.error('Audio error:', e);
        this.showError('播放失败，尝试下一首');
        setTimeout(() => this.next(), 2000);
      });
    },
    renderUI() {
      const container = document.getElementById('musicPlayer');
      container.innerHTML = `
        <div class="player-main">
          <div class="player-cover">
            <img id="playerCover" src="" alt="封面" />
          </div>
          <div class="player-info">
            <div class="player-title" id="playerTitle">-</div>
            <div class="player-artist" id="playerArtist">-</div>
            <div class="player-source" id="playerSource"></div>
          </div>
        </div>
        <div class="player-controls">
          <button id="btnPrev" class="btn-control" aria-label="上一首">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
          </button>
          <button id="btnPlay" class="btn-control btn-play" aria-label="播放">
            <svg class="icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg class="icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
          <button id="btnNext" class="btn-control" aria-label="下一首">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>
        </div>
        <div class="player-progress">
          <span id="timeNow">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="timeDuration">0:00</span>
        </div>
        <div class="player-error" id="playerError" style="display:none;"></div>
        <div class="player-queue">
          <h3>播放列表 (${this.queue.length})</h3>
          <div id="queueList" class="queue-list"></div>
        </div>
      `;

      this.renderQueue();
      this.loadTrack(0);
      this.setupControls();
    },
    renderQueue() {
      const queueList = document.getElementById('queueList');
      queueList.innerHTML = this.queue.map((item, idx) => {
        const track = item.track;
        const match = this.getBestMatch(track);
        return `
          <div class="queue-item ${idx === this.currentIndex ? 'active' : ''}" data-index="${idx}">
            <div class="queue-index">${idx + 1}</div>
            <div class="queue-info">
              <div class="queue-title">${this.escapeHtml(track.title)}</div>
              <div class="queue-artist">${this.escapeHtml(track.artist)}</div>
              <div class="queue-source">${match.provider}</div>
            </div>
          </div>
        `;
      }).join('');

      queueList.querySelectorAll('.queue-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.index);
          this.loadTrack(idx);
          this.play();
        });
      });
    },
    setupControls() {
      document.getElementById('btnPlay').addEventListener('click', () => {
        this.isPlaying ? this.pause() : this.play();
      });
      document.getElementById('btnPrev').addEventListener('click', () => this.prev());
      document.getElementById('btnNext').addEventListener('click', () => this.next());

      const progressBar = document.getElementById('progressBar');
      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        this.audio.currentTime = this.audio.duration * percent;
      });
    },
    loadTrack(index) {
      if (index < 0 || index >= this.queue.length) return;

      this.currentIndex = index;
      const track = this.queue[index].track;
      const match = this.getBestMatch(track);

      if (!match || !match.streamUrl) {
        this.showError('无可用音源');
        return;
      }

      this.audio.src = match.streamUrl;
      this.audio.load();

      document.getElementById('playerTitle').textContent = track.title;
      document.getElementById('playerArtist').textContent = track.artist;
      document.getElementById('playerCover').src = track.cover || '/images/default-cover.jpg';
      document.getElementById('playerSource').innerHTML = `
        <a href="${match.sourceUrl}" target="_blank" rel="noopener">${match.provider}</a>
        ${match.attribution ? `<span class="attribution">${this.escapeHtml(match.attribution)}</span>` : ''}
      `;

      this.updateQueueActive();
    },
    play() {
      this.audio.play().catch(err => {
        console.error('Play failed:', err);
        this.showError('播放失败');
      });
    },
    pause() {
      this.audio.pause();
    },
    next() {
      const nextIndex = (this.currentIndex + 1) % this.queue.length;
      this.loadTrack(nextIndex);
      if (this.isPlaying) this.play();
    },
    prev() {
      const prevIndex = (this.currentIndex - 1 + this.queue.length) % this.queue.length;
      this.loadTrack(prevIndex);
      if (this.isPlaying) this.play();
    },
    updatePlayButton() {
      const btn = document.getElementById('btnPlay');
      const iconPlay = btn.querySelector('.icon-play');
      const iconPause = btn.querySelector('.icon-pause');
      if (this.isPlaying) {
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
        btn.setAttribute('aria-label', '暂停');
      } else {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        btn.setAttribute('aria-label', '播放');
      }
    },
    updateProgress() {
      const current = this.audio.currentTime || 0;
      const duration = this.audio.duration || 0;
      const percent = duration > 0 ? (current / duration * 100) : 0;

      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('timeNow').textContent = this.formatTime(current);
      document.getElementById('timeDuration').textContent = this.formatTime(duration);
    },
    updateQueueActive() {
      document.querySelectorAll('.queue-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === this.currentIndex);
      });
    },
    setupMediaSession() {
      if (!('mediaSession' in navigator)) return;

      navigator.mediaSession.setActionHandler('play', () => this.play());
      navigator.mediaSession.setActionHandler('pause', () => this.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => this.prev());
      navigator.mediaSession.setActionHandler('nexttrack', () => this.next());
    },
    updateMediaSession() {
      if (!('mediaSession' in navigator)) return;

      const track = this.queue[this.currentIndex].track;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: track.artist,
        album: track.album || '',
        artwork: track.cover ? [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }] : []
      });
    },
    showError(message) {
      const errorEl = document.getElementById('playerError');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      setTimeout(() => {
        errorEl.style.display = 'none';
      }, 3000);
    },
    formatTime(seconds) {
      if (!isFinite(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    },
    escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  };

  app.init();
})();
</script>

<style>
.music-page {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.page-header {
  text-align: center;
  margin-bottom: 2rem;
}

.page-description {
  color: var(--secondary-text, #666);
  margin-top: 0.5rem;
}

.music-player-container {
  background: var(--card-bg, #fff);
  border-radius: 12px;
  padding: 2rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.player-loading, .player-empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--secondary-text, #666);
}

.player-empty .hint {
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

.player-main {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

.player-cover {
  flex-shrink: 0;
}

.player-cover img {
  width: 120px;
  height: 120px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--border-color, #e0e0e0);
}

.player-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.player-title {
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.player-artist {
  font-size: 1.1rem;
  color: var(--secondary-text, #666);
  margin-bottom: 0.5rem;
}

.player-source {
  font-size: 0.9rem;
  color: var(--secondary-text, #888);
}

.player-source a {
  color: var(--link-color, #0066cc);
  text-decoration: none;
}

.player-source a:hover {
  text-decoration: underline;
}

.attribution {
  display: block;
  margin-top: 0.25rem;
  font-size: 0.85rem;
}

.player-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.btn-control {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.5rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.btn-control:hover {
  background: var(--hover-bg, #f0f0f0);
}

.btn-play {
  width: 64px;
  height: 64px;
  background: var(--primary-color, #0066cc);
  color: white;
}

.btn-play:hover {
  background: var(--primary-hover, #0052a3);
}

.player-progress {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
  font-size: 0.9rem;
  color: var(--secondary-text, #666);
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border-color, #e0e0e0);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary-color, #0066cc);
  border-radius: 3px;
  transition: width 0.1s linear;
}

.player-error {
  background: #ffebee;
  color: #c62828;
  padding: 0.75rem;
  border-radius: 4px;
  margin-bottom: 1rem;
  text-align: center;
}

.player-queue h3 {
  margin-bottom: 1rem;
  font-size: 1.1rem;
}

.queue-list {
  max-height: 400px;
  overflow-y: auto;
}

.queue-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}

.queue-item:hover {
  background: var(--hover-bg, #f5f5f5);
}

.queue-item.active {
  background: var(--active-bg, #e3f2fd);
}

.queue-index {
  font-weight: 600;
  color: var(--secondary-text, #888);
  min-width: 2rem;
  text-align: center;
}

.queue-info {
  flex: 1;
}

.queue-title {
  font-weight: 500;
}

.queue-artist {
  font-size: 0.9rem;
  color: var(--secondary-text, #666);
}

.queue-source {
  font-size: 0.8rem;
  color: var(--secondary-text, #999);
  text-transform: capitalize;
}

@media (max-width: 640px) {
  .player-main {
    flex-direction: column;
    align-items: center;
  }

  .player-cover img {
    width: 200px;
    height: 200px;
  }

  .player-info {
    text-align: center;
  }
}
</style>
{{ end }}

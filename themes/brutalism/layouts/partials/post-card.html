{{- $cover := .Params.cover.image }}
{{- $glyph := substr (.Title | plainify) 0 1 }}
<article class="post-card-cover" data-reveal>
  <a class="pc-link" href="{{ .RelPermalink }}">
    <div class="pc-img">
      {{- if $cover }}
      <img src="{{ $cover | relURL }}" alt="{{ .Title }} 封面" loading="lazy">
      {{- else }}
      <span class="pc-img-placeholder" aria-hidden="true">{{ $glyph }}</span>
      {{- end }}
    </div>
    <div class="pc-body">
      <div class="pc-date">{{ .Date.Format "2006 · 01 · 02" }}</div>
      <h3 class="pc-title">{{ .Title }}</h3>
      <p class="pc-excerpt">{{ .Summary | plainify | truncate 96 }}</p>
      {{- with .Params.tags }}
      <div class="pc-tags">{{ range . }}<span class="pc-tag">{{ . }}</span>{{ end }}</div>
      {{- end }}
    </div>
  </a>
</article>


{{- $P := site.Data.site -}}{{- if not $P }}{{ $P = site.Params }}{{ end -}}<footer class="site-footer">
  <div class="sf-left">build {{ now.Year }} · hugo v{{ hugo.Version }}</div>
  <div class="sf-center">{{ site.Title }}</div>
  <div class="sf-right">
    {{- range $P.socialIcons }}
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .name }}</a>
    {{- end }}
    <a href="{{ "index.xml" | relURL }}">rss</a>
    <a href="{{ "sitemap.xml" | relURL }}">sitemap</a>
  </div>
</footer>

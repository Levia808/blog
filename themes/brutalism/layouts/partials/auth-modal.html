<div class="auth-overlay" id="authOverlay" hidden>
  <div class="auth-modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button class="auth-close" id="authClose" aria-label="关闭">
      <svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M205.7,194.3a8.1,8.1,0,0,1-11.4,11.4L128,139.3,61.7,205.7a8.1,8.1,0,0,1-11.4,0,8.2,8.2,0,0,1,0-11.4L116.7,128,50.3,61.7A8.1,8.1,0,0,1,61.7,50.3L128,116.7,194.3,50.3a8.1,8.1,0,0,1,11.4,11.4L139.3,128Z"/></svg>
    </button>
    <div class="auth-panel" id="authLogin">
      <h2 class="auth-title" id="authTitle">Sign in</h2>
      <form id="loginForm" class="auth-form">
        <label class="auth-field"><span>Email</span><input type="email" name="email" required placeholder="you@email.com" class="auth-input"></label>
        <label class="auth-field"><span>Password</span><input type="password" name="password" required minlength="6" placeholder="········" class="auth-input"></label>
        <p class="auth-error" id="loginError" hidden></p>
        <button type="submit" class="btn btn-block">&gt; 登录</button>
      </form>
      <div class="auth-divider">or</div>
      <button class="btn btn-block" id="githubLogin">
        <svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M208.3,75.1a102.9,102.9,0,0,0-42.5-36.9,9.8,9.8,0,0,0-8.9.5,9.5,9.5,0,0,0-4.8,8.3v27.6a15.5,15.5,0,0,1-8.8,14.1,9.5,9.5,0,0,0-1.5-18.9c-5.6,0-10.1,4.2-10.6,9.7A17.7,17.7,0,0,0,126.8,96H80.9c-1.9,0-3.9-.9-5.2-2.5a15.6,15.6,0,0,1,1.8-22.1,8,8,0,0,0,0-12.4,16.7,16.7,0,0,0-3.3-2.3,102.9,102.9,0,0,1,42.5,36.9H96.8a14.9,14.9,0,0,1-9-3.7,24.9,24.9,0,0,1-5.1-5.6,71.7,71.7,0,0,0-22,12.6l-1.2,1.2a13.9,13.9,0,0,1-10.6,4.6H48a104,104,0,0,0,135.4,99.6A15.5,15.5,0,0,0,194.6,201V149a20,20,0,0,1,4.4-12.4A100.3,100.3,0,0,0,208.3,75.1ZM202,196.6a80.1,80.1,0,0,1-60,61.2c-8.1,1.7-12.6,2.2-14.9-8.1a61,61,0,0,0-13.5-26.4c-7.1-7.4-3.2-13,2.7-15.8,8.1-3.8,16.8.8,24.4,4.2,11.4,5.1,21.1,3.3,27.7-2.6,6.6-5.9,8.1-8.5,10-13.8.7-1.9,1.7-2.6,3.9-3.6a71.8,71.8,0,0,0,20-13.4A56.6,56.6,0,0,0,199,161.6a1.7,1.7,0,0,1,2.5-.4,7.9,7.9,0,0,1,1.3,2.2,60.6,60.6,0,0,1-.8,33ZM52.4,64.6a64,64,0,0,1,13.9-8.2,8,8,0,0,1,10.3,4.5,7.9,7.9,0,0,1-4.4,10.4c-6.1,2.6-10.5,3.5-16.7,7.9a8.3,8.3,0,0,1-11.2-.7,8.1,8.1,0,0,1,8.1-13.9ZM26.9,97.1a95.1,95.1,0,0,1,13-13.4,8.1,8.1,0,0,1,11.2,11.7c-4.9,4.5-9.9,9.2-11.8,13.2A57.3,57.3,0,0,0,36,119.6a8,8,0,0,1-15.1,3A70.8,70.8,0,0,1,26.9,97.1Z"/></svg>
        GitHub 登录
      </button>
      <p class="auth-switch">还没有账号？<button type="button" class="auth-link" data-panel="authRegister">注册</button></p>
    </div>
    <div class="auth-panel" id="authRegister" hidden>
      <h2 class="auth-title">注册</h2>
      <form id="registerForm" class="auth-form">
        <label class="auth-field"><span>显示名称</span><input type="text" name="displayName" required placeholder="你的名称" class="auth-input"></label>
        <label class="auth-field"><span>邮箱</span><input type="email" name="email" required placeholder="you@email.com" class="auth-input"></label>
        <label class="auth-field"><span>密码</span><input type="password" name="password" required minlength="6" placeholder="至少 6 位" class="auth-input"></label>
        <p class="auth-error" id="registerError" hidden></p>
        <button type="submit" class="btn btn-block">&gt; 注册</button>
      </form>
      <p class="auth-switch">已有账号？<button type="button" class="auth-link" data-panel="authLogin">登录</button></p>
    </div>
    <div class="auth-panel" id="authReset" hidden>
      <h2 class="auth-title">重置密码</h2>
      <form id="resetForm" class="auth-form">
        <label class="auth-field"><span>邮箱</span><input type="email" name="email" required placeholder="you@email.com" class="auth-input"></label>
        <p class="auth-error" id="resetError" hidden></p>
        <p class="auth-success" id="resetSuccess" hidden>重置链接已发送到你的邮箱。</p>
        <button type="submit" class="btn btn-block">&gt; 发送重置链接</button>
      </form>
      <p class="auth-switch"><button type="button" class="auth-link" data-panel="authLogin">返回登录</button></p>
    </div>
  </div>
</div>

{{- $pages := .Paginator }}
{{- if gt $pages.TotalPages 1 }}
<nav class="pagination" aria-label="分页">
  {{- with $pages.HasPrev }}<a class="pg-item" href="{{ $pages.Prev.URL }}" aria-label="上一页">←</a>{{ end }}
  {{- range $pages.Pagers }}
  <a class="pg-item{{ if eq .PageNumber $pages.PageNumber }} active{{ end }}" href="{{ .URL }}">{{ .PageNumber }}</a>
  {{- end }}
  {{- with $pages.HasNext }}<a class="pg-item" href="{{ $pages.Next.URL }}" aria-label="下一页">→</a>{{ end }}
</nav>
{{- end }}

{{- $path := .RelPermalink -}}
{{- $isHome := .IsHome -}}
{{- $isArticles := or (eq .Layout "archives") (eq .Section "posts") -}}
{{- $isMoments := or (eq .Layout "moments") (hasPrefix $path "/moments/") -}}
<nav class="mobile-dock" aria-label="快捷导航">
  <a class="dock-item{{ if $isHome }} is-active{{ end }}" href="{{ "" | relLangURL }}"{{ if $isHome }} aria-current="page"{{ end }}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg><span>首页</span>
  </a>
  <a class="dock-item{{ if $isArticles }} is-active{{ end }}" href="{{ "archives/" | relLangURL }}"{{ if $isArticles }} aria-current="page"{{ end }}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 9h16M8 13h3M8 17h7"/></svg><span>文章</span>
  </a>
  <a class="dock-item{{ if $isMoments }} is-active{{ end }}" href="{{ "moments/" | relLangURL }}"{{ if $isMoments }} aria-current="page"{{ end }}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-3.7-.8L4 20l1.5-3.8A7.3 7.3 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/><path d="M8 11h8M8 14h5"/></svg><span>动态</span>
  </a>
  <button class="dock-item" id="mobileDockMenu" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="mobileDrawer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="5" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="19" cy="5" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="19" r="1.5"/><circle cx="12" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/></svg><span>菜单</span>
  </button>
</nav>

# 欢迎页配置 (管理面板「系统设置」可编辑)
typewriterText = "写代码，也写生活。记录学习与思考。"
typeSpeed = 70
deleteSpeed = 38
pause = 1800
# VariableProximity 大标题 (可变字体字重插值)
titleVariationFrom = "'wght' 400"
titleVariationTo = "'wght' 900"
proximityRadius = 140
proximityFalloff = "linear"
# ShapeBlur 叠加效果
shapeSize = 1.2
roundness = 0.4
borderSize = 0.05
circleSize = 0.3
circleEdge = 0.5
